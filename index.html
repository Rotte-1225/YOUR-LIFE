<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>18回目の春に — 青春シミュレーター [超増量版]</title>
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --card-sub: #12161c;
    --text-main: #e6edf3;
    --text-sub: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.15);
    --border: #30363d;
    --highlight: #f78166;
    --gold: #d29922;
    --green: #3fb950;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1.75;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 640px;
    padding: 16px 14px calc(120px + env(safe-area-inset-bottom));
  }

  header {
    text-align: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: normal;
    letter-spacing: 0.15em;
    margin: 0 0 4px 0;
    color: #ffffff;
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--text-sub);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ステータスバー */
  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    background: rgba(22, 27, 34, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    margin-bottom: 18px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.72rem;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
  }

  .tag {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(88, 166, 255, 0.3);
    white-space: nowrap;
  }

  .tag.friend {
    background: rgba(63, 185, 80, 0.15);
    color: var(--green);
    border-color: rgba(63, 185, 80, 0.3);
  }

  .tag.love {
    background: rgba(247, 129, 102, 0.15);
    color: var(--highlight);
    border-color: rgba(247, 129, 102, 0.3);
  }

  .tag.warn {
    background: rgba(210, 153, 34, 0.15);
    color: var(--gold);
    border-color: rgba(210, 153, 34, 0.3);
  }

  /* 年齢ごとの区切りヘッダー */
  .year-divider {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--text-sub);
    margin: 14px 0 4px;
    padding-left: 4px;
    letter-spacing: 0.08em;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 4px;
  }

  /* タイムライン */
  #timeline {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-entry {
    background: var(--card-bg);
    border-left: 3px solid var(--accent);
    padding: 11px 14px;
    border-radius: 0 8px 8px 0;
    animation: fadeIn 0.35s ease forwards;
  }

  .log-entry.sub-event {
    background: var(--card-sub);
    border-left: 2px solid #484f58;
    padding: 9px 13px;
    margin-left: 8px;
  }

  .log-entry.important {
    border-left: 3px solid var(--highlight);
    background: linear-gradient(90deg, rgba(247,129,102,0.12) 0%, var(--card-bg) 100%);
  }

  .log-entry.choice-log {
    border-left: 3px solid var(--gold);
    background: linear-gradient(90deg, rgba(210,153,34,0.12) 0%, var(--card-bg) 100%);
  }

  .age-label {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.74rem;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .log-entry.sub-event .age-label { color: var(--text-sub); }
  .log-entry.important .age-label { color: var(--highlight); }
  .log-entry.choice-log .age-label { color: var(--gold); }

  .season-badge {
    font-size: 0.68rem;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text-sub);
    font-weight: normal;
  }

  .log-text {
    font-size: 0.92rem;
    letter-spacing: 0.03em;
  }

  /* 選択肢エリア */
  #choice-area {
    margin-top: 16px;
    background: #1c2128;
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 15px;
    animation: fadeIn 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.45);
  }

  .choice-title {
    font-size: 0.88rem;
    color: var(--gold);
    margin-bottom: 11px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: bold;
  }

  .choice-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-buttons button {
    text-align: left;
    line-height: 1.45;
    padding: 12px 14px;
    font-size: 0.86rem;
    background: #22272e;
    border: 1px solid #444c56;
  }

  .choice-buttons button:hover {
    border-color: var(--gold);
  }

  /* エンディングカード */
  .ending-card {
    margin-top: 26px;
    background: linear-gradient(145deg, #161b22, #1f2937);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px 18px;
    text-align: center;
    animation: fadeIn 0.7s ease;
  }

  .ending-sub {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.75rem;
    color: var(--text-sub);
    letter-spacing: 0.15em;
  }

  .ending-title {
    font-size: 1.25rem;
    color: #fff;
    margin: 10px 0 16px;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }

  .ending-desc {
    font-size: 0.92rem;
    color: var(--text-main);
    text-align: left;
    margin-bottom: 18px;
    padding: 14px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
  }

  .ending-stats {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.78rem;
    color: var(--text-sub);
    text-align: left;
    background: rgba(255,255,255,0.03);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    line-height: 1.65;
  }

  .ending-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* スマホ下部固定コントロールバー */
  .controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(13, 17, 23, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 20;
    max-width: 640px;
    margin: 0 auto;
  }

  button {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    font-weight: bold;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-main);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: transform 0.1s, background 0.2s;
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button.primary {
    flex: 2;
    background: #238636;
    border-color: #2ea043;
    color: #ffffff;
  }

  button.share-btn {
    background: #1f6feb;
    border-color: #388bfd;
    color: #ffffff;
  }

  button.sub-btn {
    flex: 1;
    font-size: 0.82rem;
    padding: 13px 8px;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>18回目の春に</h1>
    <div class="subtitle">0歳〜18歳・矛盾なき青春ライフシミュレーター [日常＆四季増量版]</div>
  </header>

  <div class="status-bar" id="status-bar"></div>
  <div id="timeline"></div>
  <div id="choice-area" style="display: none;"></div>
  <div id="ending-area"></div>
</div>

<div class="controls">
  <button id="btn-next" class="primary" onclick="nextYear()">次の年へ進む (＋1歳)</button>
  <button id="btn-auto" class="sub-btn" onclick="toggleAuto()">オート</button>
  <button id="btn-reset" class="sub-btn" onclick="initGame()">やり直す</button>
</div>

<script>
/**
 * ==========================================================
 * 1. 状態（State）管理システム
 * ==========================================================
 */
let state = {};
let autoTimer = null;

const FRIEND_NAMES = ["ユウキ", "ハルト", "リク", "ソウタ", "アオイ", "レン", "カイト", "タクミ", "シュン"];
const HEROINE_NAMES = ["高橋さん", "佐藤さん", "関原さん", "ナノハさん", "ミナミさん", "白石さん", "西園寺さん", "橘さん"];
const NET_FRIEND_NAMES = ["レオ", "サカモト", "K", "トマト", "ヒカル", "フリーレン", "鶴田"];

function initGame() {
  stopAuto();
  const fName = FRIEND_NAMES[Math.floor(Math.random() * FRIEND_NAMES.length)];
  const hName = HEROINE_NAMES[Math.floor(Math.random() * HEROINE_NAMES.length)];
  const nName = NET_FRIEND_NAMES[Math.floor(Math.random() * NET_FRIEND_NAMES.length)];
  const initVibe = Math.floor(Math.random() * 5) - 2;

  state = {
    age: -1,
    vibe: initVibe,          // 陽キャ度(+) ⇔ 陰キャ度(-)
    study: 0,                // 学力・知性
    passion: 0,              // 部活・フィジカル熱量
    otaku: 0,                // 創作・ネット・サブカル度
    attendance: "normal",    // "normal"(通常), "separate"(別室・マイペース)
    club: "none",            // "none", "sports", "culture", "home"
    friend: {
      name: fName,
      status: "none"         // "none", "active"(親友), "moved"(転校), "estranged"(疎遠)
    },
    romance: {
      name: hName,
      status: "none"         // "none", "classmate"(隣席・顔見知り), "crush"(片想い・連絡先交換), "dating"(交際中), "ex"(元恋人)
    },
    netFriend: {
      name: nName,
      met: false
    },
    highlights: [],
    flags: new Set(),
    waitingChoice: false,
    finished: false
  };

  document.getElementById("timeline").innerHTML = "";
  document.getElementById("choice-area").style.display = "none";
  document.getElementById("ending-area").innerHTML = "";
  document.getElementById("btn-next").disabled = false;
  document.getElementById("btn-auto").disabled = false;

  updateStatusBar();
  nextYear();
}

function updateStatusBar() {
  const bar = document.getElementById("status-bar");
  const ageStr = state.age < 0 ? "誕生前" : `${state.age}歳(${getGradeString(state.age)})`;
  
  let vibeStr = "バランス型";
  if (state.vibe >= 5) vibeStr = "一軍・中心(陽)";
  else if (state.vibe >= 2) vibeStr = "社交的";
  else if (state.vibe <= -5) vibeStr = "孤高の観察者(陰)";
  else if (state.vibe <= -2) vibeStr = "静かな窓際";

  let clubMap = { none: "未所属", sports: "運動部", culture: "文化部", home: "帰宅部" };
  
  let html = `<span class="tag">${ageStr}</span>`;
  html += `<span class="tag">${vibeStr}</span>`;
  if (state.age >= 13) html += `<span class="tag">${clubMap[state.club]}</span>`;
  if (state.study >= 4) html += `<span class="tag">学力上位</span>`;
  if (state.otaku >= 4) html += `<span class="tag">創作・ネット没頭</span>`;
  if (state.attendance === "separate") html += `<span class="tag warn">別室登校</span>`;

  if (state.friend.status === "active") {
    html += `<span class="tag friend">親友:${state.friend.name}</span>`;
  } else if (state.friend.status === "moved") {
    html += `<span class="tag">親友:${state.friend.name}(遠方)</span>`;
  } else if (state.friend.status === "estranged") {
    html += `<span class="tag warn">親友:${state.friend.name}(疎遠)</span>`;
  }

  if (state.romance.status === "classmate") {
    html += `<span class="tag love">隣席:${state.romance.name}</span>`;
  } else if (state.romance.status === "crush") {
    html += `<span class="tag love">片想い:${state.romance.name}</span>`;
  } else if (state.romance.status === "dating") {
    html += `<span class="tag love">恋人:${state.romance.name}</span>`;
  } else if (state.romance.status === "ex") {
    html += `<span class="tag">元恋人:${state.romance.name}</span>`;
  }

  bar.innerHTML = html;
}

function getGradeString(age) {
  if (age <= 2) return "乳幼児";
  if (age <= 5) return "幼稚園";
  if (age <= 11) return `小${age - 5}`;
  if (age === 12) return "小6";
  if (age <= 14) return `中${age - 12}`;
  if (age === 15) return "中3";
  if (age <= 17) return `高${age - 15}`;
  return "高3";
}

/**
 * ==========================================================
 * 2. メインイベント（年齢固定の重要イベント）
 * ==========================================================
 */
const MAIN_EVENTS = [
  // 0〜5歳
  { id: "m0_quiet", age: 0, season: "誕生", cond: s => s.vibe <= 0,
    text: s => "地方の穏やかな街で生まれた。あまり泣かず、天井のモビールや窓の光を目で追う静かな赤ちゃんだった。",
    effect: s => { s.vibe -= 1; }
  },
  { id: "m0_active", age: 0, season: "誕生", cond: s => s.vibe > 0,
    text: s => "産声が病院の廊下まで響き渡るほど元気な赤ちゃんだった。誰に抱っこされてもケラケラ笑った。",
    effect: s => { s.vibe += 1; }
  },
  { id: "m1_walk", age: 1, season: "春", cond: s => true,
    text: s => "初めて自分の足で数歩あるいた日。嬉しくて部屋中をよちよち歩き回り、そのまま絨毯の上で眠り込んだ。",
    effect: s => {}
  },
  { id: "m2_blocks", age: 2, season: "秋", cond: s => s.vibe <= 0,
    text: s => "積み木を自分の背丈近くまで規則正しく並べるのに夢中になった。少しでもズレると最初からやり直した。",
    effect: s => { s.otaku += 1; s.study += 1; }
  },
  { id: "m2_run", age: 2, season: "夏", cond: s => s.vibe > 0,
    text: s => "外に出るとすぐに親の手を振り切って駆け出し、公園の遊具へ一直線に向かっていった。",
    effect: s => { s.passion += 1; }
  },
  { id: "m3_sand", age: 3, season: "春", cond: s => s.vibe <= 0,
    text: s => "公園の砂場では、みんなの輪に入るより、一人で黙々と精巧なトンネルや水路を掘るのが好きだった。",
    effect: s => { s.vibe -= 1; s.otaku += 1; }
  },
  { id: "m3_friends", age: 3, season: "春", cond: s => s.vibe > 0,
    text: s => "幼稚園の入園初日から周りの子に自分から声をかけ、帰る頃には泥だらけになって笑っていた。",
    effect: s => { s.vibe += 1; }
  },
  { id: "m4_game", age: 4, season: "冬", cond: s => true,
    text: s => "親のスマホやゲーム機の画面に釘付けになり、大人より早く操作のコツを掴んで周囲を驚かせた。",
    effect: s => { s.otaku += 1; }
  },
  { id: "m5_play_tree", age: 5, season: "秋", cond: s => s.vibe <= 0,
    text: s => "幼稚園のお遊戯会。『木の役』を任され、本番で一歩も動かず役割を全うして先生に褒められた。",
    effect: s => {}
  },
  { id: "m5_play_hero", age: 5, season: "秋", cond: s => s.vibe > 0,
    text: s => "幼稚園のお遊戯会でメインの役をやりたがり、本番ではアドリブを入れて会場の笑いを誘った。",
    effect: s => { s.vibe += 1; }
  },

  // 6〜12歳（小学生）
  { id: "m6_enter", age: 6, season: "春", cond: s => true,
    text: s => "小学校に入学。真新しいランドセルの革の匂いと、広すぎる教室に少しだけ胸が高鳴った。",
    effect: s => {}
  },
  { id: "m7_friend_meet", age: 7, season: "春", important: true, cond: s => s.friend.status === "none",
    text: s => `小2のクラス替えで隣の席になった「${s.friend.name}」と意気投合した。放課後、ランドセルを放り投げて毎日遊ぶようになった。`,
    effect: s => { s.friend.status = "active"; s.highlights.push(`7歳：最初の親友・${s.friend.name}と出会う`); }
  },
  { id: "m8_base", age: 8, season: "夏", cond: s => s.friend.status === "active",
    text: s => `${s.friend.name}と一緒に、近所の雑木林の奥にダンボールで『秘密基地』を作った。あの狭い空間が僕たちの世界の中心だった。`,
    effect: s => { s.flags.add("secret_base"); }
  },
  { id: "m10_role", age: 10, season: "秋", cond: s => true,
    text: s => "高学年のクラブ活動と委員会が始まった。クラスの中で「目立つグループ」と「静かなグループ」が少しずつ分かれ始めた。",
    effect: s => {}
  },
  { id: "m11_friend_move", age: 11, season: "春", important: true,
    cond: s => s.friend.status === "active" && Math.random() < 0.42,
    text: s => `親友の${s.friend.name}が、親の転勤で遠くの街へ引っ越すことになった。最後の日、走る車を自転車で追いかけながら「絶対また遊ぼうな！」と叫んだ。`,
    effect: s => { s.friend.status = "moved"; s.highlights.push(`11歳：親友の${s.friend.name}が転校してしまう`); }
  },
  { id: "m11_camp", age: 11, season: "夏", cond: s => s.friend.status === "active",
    text: s => `林間学校の夜、${s.friend.name}と消灯時間を過ぎても懐中電灯を照らして怖い話や将来の話をして、先生にこっぴどく怒られた。`,
    effect: s => { s.vibe += 1; }
  },
  { id: "m12_grad_moved", age: 12, season: "春", cond: s => s.friend.status === "moved",
    text: s => `小学校の卒業式。${s.friend.name}のいない体育館で卒業証書を受け取り、子ども時代がひとつ終わったことを静かに実感した。`,
    effect: s => {}
  },
  { id: "m12_grad_active", age: 12, season: "春", cond: s => s.friend.status === "active",
    text: s => `小学校の卒業式。少しブカブカの制服を着て、${s.friend.name}と「中学でも同じクラスだといいな」と笑いながら校門を出た。`,
    effect: s => {}
  },

  // 13〜15歳（中学生）
  { id: "m14_net_meet", age: 14, season: "深夜", important: true, cond: s => s.otaku >= 3 && !s.netFriend.met,
    text: s => `深夜、ネットのコミュニティで知り合った「${s.netFriend.name}」たちと初めて通話した。顔も知らないのに、学校の誰よりも話が合った。`,
    effect: s => { s.netFriend.met = true; s.otaku += 2; s.highlights.push(`14歳：ネットの仲間・${s.netFriend.name}たちと出会う`); }
  },
  { id: "m14_friend_estranged", age: 14, season: "秋", important: true,
    cond: s => s.friend.status === "active" && s.vibe <= -2 && Math.random() < 0.5,
    text: s => `クラス替えで${s.friend.name}と別々のクラスになった。廊下ですれ違ってもお互い違うグループにいて、少しずつ視線を逸らすようになっていった。`,
    effect: s => { s.friend.status = "estranged"; s.highlights.push(`14歳：${s.friend.name}と少しずつ疎遠になる`); }
  },
  { id: "m15_sports_retire", age: 15, season: "夏", important: true, cond: s => s.club === "sports",

/**
 * ==========================================================
 * 5. 進行エンジン（1年に複数の出来事を生成するロジック）
 * ==========================================================
 */
function nextYear() {
  if (state.waitingChoice || state.finished) return;
  state.age += 1;

  addYearDivider(state.age);

  // 選択肢がある年齢ならまず選択肢を表示
  if (CHOICES[state.age] && !state.flags.has(`choice_${state.age}`)) {
    state.flags.add(`choice_${state.age}`);
    showChoice(CHOICES[state.age]);
    updateStatusBar();
    return;
  }

  runMultipleEventsForAge(state.age);
  updateStatusBar();

  if (state.age >= 18) {
    finishGame();
  }
}

/**
 * その年齢の「メインイベント1つ」＋「季節・日常のサブイベント1〜2つ」をまとめて出力
 */
function runMultipleEventsForAge(age) {
  // 1. 年齢前半のサブイベント（小学生以上は高確率で1つ挟む）
  if (age >= 2 && age <= 17) {
    pickAndRunSubEvent(age);
  }

  // 2. その年齢のメインイベント
  let mainCandidates = MAIN_EVENTS.filter(ev => ev.age === age && !state.flags.has(ev.id) && ev.cond(state));
  if (mainCandidates.length > 0) {
    const importantOnes = mainCandidates.filter(e => e.important);
    const pool = (importantOnes.length > 0 && Math.random() < 0.85) ? importantOnes : mainCandidates;
    const selected = pool[Math.floor(Math.random() * pool.length)];
    state.flags.add(selected.id);
    const txt = selected.text(state);
    selected.effect(state);
    addLog(age, txt, selected.season || "出来事", selected.important, false, false);
  }

  // 3. 年齢後半のサブイベント（中高生はさらに1〜2個追加して1年の密度を高める）
  const extraCount = age >= 13 ? 2 : (age >= 6 ? 1 : 0);
  for (let i = 0; i < extraCount; i++) {
    pickAndRunSubEvent(age);
  }
}

function pickAndRunSubEvent(age) {
  const candidates = SUB_EVENTS.filter(ev =>
    age >= ev.minAge &&
    age <= ev.maxAge &&
    !state.flags.has(ev.id) &&
    ev.cond(state)
  );
  if (candidates.length > 0) {
    const ev = candidates[Math.floor(Math.random() * candidates.length)];
    state.flags.add(ev.id);
    addLog(age, ev.text(state), ev.season || "日常", false, false, true);
  }
}

function addYearDivider(age) {
  const timeline = document.getElementById("timeline");
  const div = document.createElement("div");
  div.className = "year-divider";
  div.textContent = `▼ ${age}歳 （${getGradeString(age)}）`;
  timeline.appendChild(div);
}

function addLog(age, text, seasonLabel = "日常", isImportant = false, isChoice = false, isSub = false) {
  const timeline = document.getElementById("timeline");
  const div = document.createElement("div");
  let cls = "log-entry";
  if (isImportant) cls += " important";
  else if (isChoice) cls += " choice-log";
  else if (isSub) cls += " sub-event";
  div.className = cls;

  let badge = `<span class="season-badge">${seasonLabel}</span>`;
  if (isImportant) badge = `<span class="season-badge" style="color:#f78166;">★ 転機・${seasonLabel}</span>`;
  else if (isChoice) badge = `<span class="season-badge" style="color:#d29922;">◆ 選択・${seasonLabel}</span>`;

  div.innerHTML = `
    <div class="age-label">
      <span>【${age}歳】 ${getGradeString(age)}</span>
      ${badge}
    </div>
    <div class="log-text">${text}</div>
  `;
  timeline.appendChild(div);
  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 40);
}

function showChoice(choiceObj) {
  stopAuto();
  state.waitingChoice = true;
  document.getElementById("btn-next").disabled = true;

  const area = document.getElementById("choice-area");
  area.style.display = "block";
  area.innerHTML = `
    <div class="choice-title">${choiceObj.title}</div>
    <div class="choice-buttons" id="choice-buttons"></div>
  `;

  const btnContainer = document.getElementById("choice-buttons");
  choiceObj.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt.label;
    btn.onclick = () => {
      area.style.display = "none";
      state.waitingChoice = false;
      document.getElementById("btn-next").disabled = false;
      opt.action(state);
      // 選択肢のあとに、その年齢のメインイベント＆日常イベントも連続発生させる
      runMultipleEventsForAge(state.age);
      updateStatusBar();
      if (state.age >= 18) {
        finishGame();
      }
    };
    btnContainer.appendChild(btn);
  });

  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 50);
}

  const hlText = state.highlights.length > 0
    ? state.highlights.map(h => `・${h}`).join("\n")
    : "・穏やかで平穏な18年間を過ごした";

  const shareText = `【18回目の春に — 青春シミュレーター】\n到達エンディング：${state.endingTitle}\n\n${hlText}\n\nhttps://rotte-1225.github.io/YOUR-LIFE/\n#18回目の春に`;
  
  navigator.clipboard.writeText(shareText).then(() => {
    const btn = document.getElementById("btn-copy");
    btn.textContent = "コピーしました！（LINEやDiscordに貼れます）";
    setTimeout(() => {
      btn.textContent = "結果をコピーしてシェアする";
    }, 3000);
  });
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    document.getElementById("btn-auto").textContent = "停止";
    autoTimer = setInterval(() => {
      if (!state.waitingChoice && !state.finished) nextYear();
    }, 1200);
  }
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    document.getElementById("btn-auto").textContent = "オート";
  }
}

window.onload = initGame;
</script>
</body>
</html>
