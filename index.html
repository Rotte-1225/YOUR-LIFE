<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>18回目の春に — 青春シミュレーター 完全版</title>
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --text-main: #e6edf3;
    --text-sub: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.15);
    --border: #30363d;
    --highlight: #f78166;
    --gold: #d29922;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1.75;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 620px;
    padding: 18px 14px calc(115px + env(safe-area-inset-bottom));
  }

  header {
    text-align: center;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: normal;
    letter-spacing: 0.15em;
    margin: 0 0 4px 0;
    color: #ffffff;
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--text-sub);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ステータスバー（スマホ上部固定） */
  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    background: rgba(22, 27, 34, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    margin-bottom: 18px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.72rem;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
  }

  .tag {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(88, 166, 255, 0.3);
    white-space: nowrap;
  }

  .tag.friend {
    background: rgba(63, 185, 80, 0.15);
    color: #3fb950;
    border-color: rgba(63, 185, 80, 0.3);
  }

  .tag.love {
    background: rgba(247, 129, 102, 0.15);
    color: var(--highlight);
    border-color: rgba(247, 129, 102, 0.3);
  }

  .tag.warn {
    background: rgba(210, 153, 34, 0.15);
    color: var(--gold);
    border-color: rgba(210, 153, 34, 0.3);
  }

  /* タイムライン */
  #timeline {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .log-entry {
    background: var(--card-bg);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
    animation: fadeIn 0.35s ease forwards;
  }

  .log-entry.important {
    border-left-color: var(--highlight);
    background: linear-gradient(90deg, rgba(247,129,102,0.1) 0%, var(--card-bg) 100%);
  }

  .log-entry.choice-log {
    border-left-color: var(--gold);
    background: linear-gradient(90deg, rgba(210,153,34,0.1) 0%, var(--card-bg) 100%);
  }

  .age-label {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.76rem;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  .log-entry.important .age-label { color: var(--highlight); }
  .log-entry.choice-log .age-label { color: var(--gold); }

  .log-text {
    font-size: 0.94rem;
    letter-spacing: 0.03em;
  }

  /* 選択肢エリア */
  #choice-area {
    margin-top: 18px;
    background: #1c2128;
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 16px;
    animation: fadeIn 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .choice-title {
    font-size: 0.9rem;
    color: var(--gold);
    margin-bottom: 12px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: bold;
  }

  .choice-buttons {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .choice-buttons button {
    text-align: left;
    line-height: 1.45;
    padding: 13px 15px;
    font-size: 0.88rem;
    background: #22272e;
    border: 1px solid #444c56;
  }

  .choice-buttons button:hover {
    border-color: var(--gold);
  }

  /* エンディングカード */
  .ending-card {
    margin-top: 26px;
    background: linear-gradient(145deg, #161b22, #1f2937);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px 18px;
    text-align: center;
    animation: fadeIn 0.7s ease;
  }

  .ending-sub {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.75rem;
    color: var(--text-sub);
    letter-spacing: 0.15em;
  }

  .ending-title {
    font-size: 1.25rem;
    color: #fff;
    margin: 10px 0 16px;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }

  .ending-desc {
    font-size: 0.92rem;
    color: var(--text-main);
    text-align: left;
    margin-bottom: 18px;
    padding: 14px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
  }

  .ending-stats {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.78rem;
    color: var(--text-sub);
    text-align: left;
    background: rgba(255,255,255,0.03);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    line-height: 1.6;
  }

  .ending-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* スマホ下部固定コントロールバー */
  .controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(13, 17, 23, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 20;
    max-width: 620px;
    margin: 0 auto;
  }

  button {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.9rem;
    font-weight: bold;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-main);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: transform 0.1s, background 0.2s;
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button.primary {
    flex: 2;
    background: #238636;
    border-color: #2ea043;
    color: #ffffff;
  }

  button.share-btn {
    background: #1f6feb;
    border-color: #388bfd;
    color: #ffffff;
  }

  button.sub-btn {
    flex: 1;
    font-size: 0.82rem;
    padding: 13px 8px;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>18回目の春に</h1>
    <div class="subtitle">0歳〜18歳・矛盾なき青春ライフシミュレーター [完全版]</div>
  </header>

  <div class="status-bar" id="status-bar"></div>
  <div id="timeline"></div>
  <div id="choice-area" style="display: none;"></div>
  <div id="ending-area"></div>
</div>

<div class="controls">
  <button id="btn-next" class="primary" onclick="nextYear()">次の年へ (＋1歳)</button>
  <button id="btn-auto" class="sub-btn" onclick="toggleAuto()">オート</button>
  <button id="btn-reset" class="sub-btn" onclick="initGame()">やり直す</button>
</div>

<script>
/**
 * ==========================================================
 * 1. 状態（State）管理システム
 * ==========================================================
 */
let state = {};
let autoTimer = null;

const FRIEND_NAMES = ["ユウキ", "ハルト", "リク", "ソウタ", "アオイ", "レン", "カイト", "タクミ", "シュン"];
const HEROINE_NAMES = ["高橋さん", "佐藤さん", "関原さん", "ナノハさん", "ミナミさん", "白石さん", "西園寺さん", "橘さん"];
const NET_FRIEND_NAMES = ["レオ", "サカモト", "K", "トマト", "ヒカル", "ナイト"];

function initGame() {
  stopAuto();
  const fName = FRIEND_NAMES[Math.floor(Math.random() * FRIEND_NAMES.length)];
  const hName = HEROINE_NAMES[Math.floor(Math.random() * HEROINE_NAMES.length)];
  const nName = NET_FRIEND_NAMES[Math.floor(Math.random() * NET_FRIEND_NAMES.length)];
  const initVibe = Math.floor(Math.random() * 5) - 2; // -2 〜 +2

  state = {
    age: -1,
    vibe: initVibe,          // 陽キャ度(+) ⇔ 陰キャ度(-)
    study: 0,                // 学力・知性
    passion: 0,              // 部活・行動熱量
    otaku: 0,                // 創作・ネット・サブカル度
    snsTrouble: false,       // SNS・人間関係疲れ経験フラグ
    attendance: "normal",    // "normal"(通常), "separate"(別室・マイペース)
    club: "none",            // "none", "sports", "culture", "home"
    friend: {
      name: fName,
      status: "none"         // "none", "active"(親友), "moved"(転校), "estranged"(疎遠・ケンカ)
    },
    romance: {
      name: hName,
      status: "none"         // "none", "classmate"(顔見知り), "crush"(片想い・連絡先交換), "dating"(交際中), "ex"(元恋人)
    },
    netFriend: {
      name: nName,
      met: false
    },
    highlights: [],          // エンディング振り返り用の重要ログ記録
    flags: new Set(),
    waitingChoice: false,
    finished: false
  };

  document.getElementById("timeline").innerHTML = "";
  document.getElementById("choice-area").style.display = "none";
  document.getElementById("ending-area").innerHTML = "";
  document.getElementById("btn-next").disabled = false;
  document.getElementById("btn-auto").disabled = false;

  updateStatusBar();
  nextYear();
}

function updateStatusBar() {
  const bar = document.getElementById("status-bar");
  const ageStr = state.age < 0 ? "誕生前" : `${state.age}歳(${getGradeString(state.age)})`;
  
  let vibeStr = "バランス型";
  if (state.vibe >= 5) vibeStr = "学校の中心(陽)";
  else if (state.vibe >= 2) vibeStr = "社交的";
  else if (state.vibe <= -5) vibeStr = "孤高の観察者(陰)";
  else if (state.vibe <= -2) vibeStr = "静かな窓際";

  let clubMap = { none: "未所属", sports: "運動部", culture: "文化部", home: "帰宅部" };
  
  let html = `<span class="tag">${ageStr}</span>`;
  html += `<span class="tag">${vibeStr}</span>`;
  if (state.age >= 13) html += `<span class="tag">${clubMap[state.club]}</span>`;
  if (state.study >= 4) html += `<span class="tag">学年上位</span>`;
  if (state.otaku >= 4) html += `<span class="tag">創作・ネット界隈</span>`;
  if (state.attendance === "separate") html += `<span class="tag warn">別室・マイペース登校</span>`;

  if (state.friend.status === "active") {
    html += `<span class="tag friend">親友:${state.friend.name}</span>`;
  } else if (state.friend.status === "moved") {
    html += `<span class="tag">親友:${state.friend.name}(遠方)</span>`;
  } else if (state.friend.status === "estranged") {
    html += `<span class="tag warn">親友:${state.friend.name}(疎遠)</span>`;
  }

  if (state.romance.status === "classmate") {
    html += `<span class="tag love">隣席:${state.romance.name}</span>`;
  } else if (state.romance.status === "crush") {
    html += `<span class="tag love">片想い:${state.romance.name}</span>`;
  } else if (state.romance.status === "dating") {
    html += `<span class="tag love">恋人:${state.romance.name}</span>`;
  } else if (state.romance.status === "ex") {
    html += `<span class="tag">元恋人:${state.romance.name}</span>`;
  }

  bar.innerHTML = html;
}

function getGradeString(age) {
  if (age <= 2) return "乳幼児";
  if (age <= 5) return "幼稚園";
  if (age <= 11) return `小${age - 5}`;
  if (age === 12) return "小6";
  if (age <= 14) return `中${age - 12}`;
  if (age === 15) return "中3";
  if (age <= 17) return `高${age - 15}`;
  return "高3";
}

/**
 * ==========================================================
 * 2. ライフイベントデータベース（全80種以上・矛盾ゼロ設計）
 * ==========================================================
 */
const EVENTS = [
  // ================= 0〜5歳（幼少期） =================
  { id: "e0_quiet", age: 0, cond: s => s.vibe <= 0,
    text: s => "地方の静かな街で生まれた。あまり泣かず、窓から揺れる光や天井のモビールをじっと見つめている赤ちゃんだった。",
    effect: s => { s.vibe -= 1; }
  },
  { id: "e0_active", age: 0, cond: s => s.vibe > 0,
    text: s => "産声が病院の廊下まで響き渡るほど元気な赤ちゃんだった。誰に抱っこされても声を上げて笑った。",
    effect: s => { s.vibe += 1; }
  },
  { id: "e1_walk", age: 1, cond: s => true,
    text: s => "初めて自分の足で歩いた日、嬉しくなって部屋中をよちよちと探検し、そのまま電池が切れたように絨毯の上で眠った。",
    effect: s => {}
  },
  { id: "e1_first_word", age: 1, cond: s => true,
    text: s => "窓の外を走る車や猫を指差して、意味のある言葉を少しずつ話し始めた。",
    effect: s => { s.study += 1; }
  },
  { id: "e2_blocks", age: 2, cond: s => s.vibe <= 0,
    text: s => "積み木やブロックを自分の背丈近くまで規則正しく積み上げるのに夢中になった。職人のような集中力だった。",
    effect: s => { s.otaku += 1; s.study += 1; }
  },
  { id: "e2_run", age: 2, cond: s => s.vibe > 0,
    text: s => "買い物に行くとすぐに親の手を振り切って走り出し、迷子センターのお世話になりかけた。",
    effect: s => { s.passion += 1; }
  },
  { id: "e3_park_solo", age: 3, cond: s => s.vibe <= 0,
    text: s => "公園の砂場では、みんなの輪に入るより、一人で黙々と精巧なトンネルやダムを造るのが好きだった。",
    effect: s => { s.vibe -= 1; s.otaku += 1; }
  },
  { id: "e3_park_group", age: 3, cond: s => s.vibe > 0,
    text: s => "公園に行けば初対面の子の手を引いて滑り台へ駆け回り、帰る頃には服が泥だらけになっていた。",
    effect: s => { s.vibe += 1; s.passion += 1; }
  },
  { id: "e4_game", age: 4, cond: s => true,
    text: s => "親のスマホやゲーム機の画面に釘付けになり、大人より早く操作を覚えて周囲を驚かせた。",
    effect: s => { s.otaku += 1; }
  },
  { id: "e4_picture_book", age: 4, cond: s => s.vibe <= 0,
    text: s => "寝る前の絵本の読み聞かせが大好きで、お気に入りのページを暗記するほど何度も読んでもらった。",
    effect: s => { s.study += 1; }
  },
  { id: "e5_play_tree", age: 5, cond: s => s.vibe <= 0,
    text: s => "幼稚園のお遊戯会。『木の役』を任され、本番で一歩も動かず役割を全うして先生に褒められた。",
    effect: s => {}
  },
  { id: "e5_play_hero", age: 5, cond: s => s.vibe > 0,
    text: s => "幼稚園のお遊戯会で主役級をやりたがり、本番ではアドリブを入れて保護者の笑いを誘った。",
    effect: s => { s.vibe += 1; }
  },

  // ================= 6〜12歳（小学生） =================
  { id: "e6_enter", age: 6, cond: s => true,
    text: s => "小学校に入学。自分の体より大きく見えるランドセルを背負い、桜並木の通学路を歩いた。",
    effect: s => {}
  },
  { id: "e7_friend_meet", age: 7, important: true, cond: s => s.friend.status === "none",
    text: s => `小2のクラス替えで隣の席になった「${s.friend.name}」と意気投合した。放課後、ランドセルを放り投げて毎日一緒に遊ぶようになった。`,
    effect: s => { s.friend.status = "active"; s.highlights.push(`7歳：最初の親友・${s.friend.name}と出会う`); }
  },
  { id: "e8_secret_base", age: 8, cond: s => s.friend.status === "active" && s.vibe >= 0,
    text: s => `夏休み、${s.friend.name}と一緒に近所の裏山に『秘密基地』を作った。拾ったビー玉や古いマンガが僕たちの宝物だった。`,
    effect: s => { s.flags.add("secret_base"); s.passion += 1; }
  },
  { id: "e8_library", age: 8, cond: s => s.vibe < 0,
    text: s => "昼休みに校庭でドッジボールをするより、図書室の隅でファンタジー小説や図鑑を読んでいる方が落ち着くことに気づいた。",
    effect: s => { s.otaku += 1; s.study += 1; }
  },
  { id: "e8_pool", age: 8, cond: s => true,
    text: s => "夏休みの市民プール。塩素の匂いと帰りに食べるアイスの冷たさが、小学生の夏のすべてだった。",
    effect: s => {}
  },
  // 9歳は選択肢あり
  { id: "e9_after_game", age: 9, cond: s => s.friend.status === "active",
    text: s => `${s.friend.name}と通信ケーブルやオンラインでゲームを繋ぎ、ボスを倒した瞬間に部屋でハイタッチした。`,
    effect: s => { s.otaku += 1; }
  },
  { id: "e10_test_100", age: 10, cond: s => s.study >= 2,
    text: s => "小4の算数と理科のテストで連続100点を取った。少しだけクラスで「頭がいいやつ」として見られるようになった。",
    effect: s => { s.study += 1; }
  },
  { id: "e10_relay", age: 10, cond: s => s.passion >= 2,
    text: s => "運動会のリレー選手に選ばれた。バトンを受け取ってコーナーを抜けたときの歓声が忘れられなかった。",
    effect: s => { s.vibe += 1; s.passion += 1; }
  },
  { id: "e10_rain_day", age: 10, cond: s => s.study < 2 && s.passion < 2,
    text: s => "雨の日の休み時間、黒板の隅に相合傘や迷路を描いて遊んだ。窓の外の紫陽花が濡れていた。",
    effect: s => {}
  },
  // 11歳：親友の転校分岐 or ケンカ分岐 or 継続
  { id: "e11_friend_move", age: 11, important: true,
    cond: s => s.friend.status === "active" && Math.random() < 0.4,
    text: s => `親友の${s.friend.name}が、親の転勤で遠くの街へ引っ越すことになった。最後の日、走る車を自転車で追いかけながら「絶対また遊ぼうな！」と叫んだ。`,
    effect: s => { s.friend.status = "moved"; s.highlights.push(`11歳：親友の${s.friend.name}が遠くの街へ転校`); }
  },
  { id: "e11_camp", age: 11, cond: s => s.friend.status === "active",
    text: s => `林間学校のキャンプファイヤー。火の粉が舞い上がる夜空の下で、${s.friend.name}と消灯時間を過ぎても将来の話をした。`,
    effect: s => { s.vibe += 1; }
  },
  { id: "e12_grad_moved", age: 12, cond: s => s.friend.status === "moved",
    text: s => `小学校の卒業式。${s.friend.name}のいない体育館で卒業証書を受け取り、子ども時代がひとつ終わったことを感じた。`,
    effect: s => {}
  },
  { id: "e12_grad_active", age: 12, cond: s => s.friend.status === "active",
    text: s => `小学校の卒業式。大きくなった制服を着て、${s.friend.name}と「中学でも同じクラスだといいな」と言いながら校門を出た。`,
    effect: s => {}
  },

  // ================= 13〜15歳（中学生） =================

          addLog(18, "高3の夏。これまでの自分のアイデアと技術をすべて詰め込んだ作品を完成させ、ネットの海へ公開した。確かな手応えがあった。", false, true);
        }
      }
    ]
  }
};

/**
 * ==========================================================
 * 4. 進行エンジン
 * ==========================================================
 */
function nextYear() {
  if (state.waitingChoice || state.finished) return;
  state.age += 1;

  // 選択肢が発生する年齢かチェック
  if (CHOICES[state.age] && !state.flags.has(`choice_${state.age}`)) {
    state.flags.add(`choice_${state.age}`);
    showChoice(CHOICES[state.age]);
    updateStatusBar();
    return;
  }

  runEventsForCurrentAge();
  updateStatusBar();

  if (state.age >= 18) {
    finishGame();
  }
}

function runEventsForCurrentAge() {
  let candidates = EVENTS.filter(ev => ev.age === state.age && !state.flags.has(ev.id) && ev.cond(state));
  let selectedEvent = null;

  if (candidates.length > 0) {
    const importantOnes = candidates.filter(e => e.important);
    const pool = (importantOnes.length > 0 && Math.random() < 0.8) ? importantOnes : candidates;
    selectedEvent = pool[Math.floor(Math.random() * pool.length)];
  }

  if (selectedEvent) {
    state.flags.add(selectedEvent.id);
    const text = selectedEvent.text(state);
    selectedEvent.effect(state);
    addLog(state.age, text, selectedEvent.important, false);
  } else {
    addLog(state.age, generateFallbackText(state), false, false);
  }
}

function generateFallbackText(s) {
  if (s.age <= 5) return "季節ごとに少しずつ背が伸び、窓の外の世界にある言葉や色を覚えていった。";
  if (s.age <= 12) return "夕方の防災無線のメロディとランドセルの揺れる音の中で、穏やかな小学生の1年が過ぎていった。";
  if (s.attendance === "separate") return "自分のペースで登校し、静かな部屋でページをめくりながら心穏やかな1年を過ごした。";
  if (s.vibe >= 2) return "休み時間の賑やかな笑い声や放課後の寄り道に囲まれて、あっという間に季節が巡った。";
  return "教室の窓から差し込む日差しと、深夜の静かな部屋の空気の中で、僕なりの1年が過ぎていった。";
}

function addLog(age, text, isImportant = false, isChoice = false) {
  const timeline = document.getElementById("timeline");
  const div = document.createElement("div");
  let cls = "log-entry";
  if (isImportant) cls += " important";
  else if (isChoice) cls += " choice-log";
  div.className = cls;

  let badge = "";
  if (isImportant) badge = "<span>★ 転機</span>";
  else if (isChoice) badge = "<span>◆ 選択</span>";

  div.innerHTML = `
    <div class="age-label">
      <span>【${age}歳】 ${getGradeString(age)}</span>
      ${badge}
    </div>
    <div class="log-text">${text}</div>
  `;
  timeline.appendChild(div);
  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 40);
}

function showChoice(choiceObj) {
  stopAuto();
  state.waitingChoice = true;
  document.getElementById("btn-next").disabled = true;

  const area = document.getElementById("choice-area");
  area.style.display = "block";
  area.innerHTML = `
    <div class="choice-title">${choiceObj.title}</div>
    <div class="choice-buttons" id="choice-buttons"></div>
  `;

  const btnContainer = document.getElementById("choice-buttons");
  choiceObj.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt.label;
    btn.onclick = () => {
      area.style.display = "none";
      state.waitingChoice = false;
      document.getElementById("btn-next").disabled = false;
      opt.action(state);
      // 選択肢のあと、同年齢のイベントも1つ走らせる（18歳は卒業イベントを必ず走らせる）
      runEventsForCurrentAge();
      updateStatusBar();
      if (state.age >= 18) {
        finishGame();
      }
    };
    btnContainer.appendChild(btn);
  });

  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 50);
}

/**
 * ==========================================================
 * 5. マルチエンディング判定（全12種類）＆シェア機能
 * ==========================================================
 */
function finishGame() {
  stopAuto();
  state.finished = true;
  document.getElementById("btn-next").disabled = true;
  document.getElementById("btn-auto").disabled = true;

  let title = "";
  let desc = "";

  // 12種類の緻密なエンディング分岐
  if (state.attendance === "separate" && state.study >= 5) {
    title = "『静かな別室から、知の頂へ』";
    desc = "大人数の教室のペースに無理に合わせることはしなかった。けれど、静かな別室で先生たちに支えられながら積み上げた知識と思考力は、他の誰にも負けない武器になった。自分だけの時計で歩み抜いた、誇り高き18年間。";
  } else if (state.attendance === "separate") {
    title = "『自分だけの時計と、優しい春』";
    desc = "みんなと同じ教室、同じ歩幅で歩くことは選ばなかったけれど、自分の心を守りながら穏やかに単位を積み重ねた日々は、何よりも尊い時間だった。焦らず蓄えたエネルギーで、新しい春へ歩き出す。";
  } else if (state.otaku >= 7 && state.study >= 4) {
    title = "『深夜2時のアーキテクト（創造主）』";
    desc = "昼間は物静かな一生徒、しかし深夜のモニターの前では物語を紡ぎ、コードを書き、コミュニティを動かす創造主だった。二つの世界を行き来しながら知性と創作を極めた、唯一無二の青春。";
  } else if (state.romance.status === "dating" && state.vibe >= 3) {
    title = "『王道のスポットライトの中心で』";
    desc = `騒がしい仲間との放課後も、${state.romance.name}と手を繋いだ文化祭や花火大会も、すべてが映画のワンシーンのように眩しい18年間だった。数え切れない思い出を胸に、春からのステージへ駆け出してゆく。`;
  } else if (state.romance.status === "dating") {
    title = "『教室の隅で見つけた、たった一つの奇跡』";
    desc = `決してクラスの中心で目立つタイプではなかったけれど、隣にいてくれた${state.romance.name}との穏やかな時間だけは、何よりも確かな宝物だった。二人で交わした約束が、これからの未来を照らしている。`;
  } else if (state.romance.status === "ex") {
    title = "『冬の白い息と、ほろ苦い栞』";
    desc = `${state.romance.name}と過ごした季節も、進路のすれ違いで別れた冬の帰り道も、すべてが自分を大人にしてくれた。痛みの分だけ誰かに優しくなれる、切なくも美しい18年間。`;
  } else if (state.otaku >= 6) {
    title = "『ブルーライトの向こう側の楽園』";
    desc = "学校の教室だけが世界のすべてじゃなかった。深夜の通話サーバーや創作サイトで出会った仲間たちと笑い合い、自分の好きなものを貫き通した、最高に自由な僕だけの青春。";
  } else if (state.passion >= 5 && state.club === "sports") {
    title = "『汗と白線の向こう側』";
    desc = "放課後も夏休みもすべてを部活に捧げた。勝った日の歓声も、負けた日の部室の匂いも、すべてが自分の血肉になっている。ユニフォームを脱いだ今、どんな遠い場所へだって走っていける。";
  } else if (state.study >= 6) {
    title = "『ペン先が切り拓く、まだ見ぬ世界』";
    desc = "深夜のデスクライトの下で積み重ねたノートと参考書の山は、決して自分を裏切らなかった。知ることの楽しさと圧倒的な実力を手に、さらに広い学問の海へと旅立つ。";
  } else if (state.flags.has("reunion") && state.friend.status === "active") {
    title = "『距離を超えて繋がった、ふたりの軌跡』";
    desc = `一度は遠く離れた親友・${s_friendName()}との奇跡のような再会。どんなに環境が変わっても変わらない絆があることを知った、温かい18年間だった。`;
  } else if (state.romance.status === "crush" || state.romance.status === "classmate") {
    title = "『ページに挟んだままの恋文』";
    desc = `${state.romance.name}との何気ない会話や、少しだけ近づいた文化祭の記憶。最後まで想いを言葉にはしなかったけれど、だからこそ永遠に色褪せない、甘酸っぱく静かな青春だった。`;
  } else {
    title = "『名もなき日々の愛おしさ』";
    desc = "劇的な大事件があったわけじゃない。けれど、夕暮れの通学路の色や、イヤホンから流れていた音楽は確かにここにあった。何者でもなかった僕が、何者かになるための18年間が、今静かに幕を閉じる。";
  }

  state.endingTitle = title;

  const hlHtml = state.highlights.length > 0
    ? state.highlights.map(h => `・${h}`).join("<br>")
    : "・穏やかで平穏な18年間を過ごした";

  const endArea = document.getElementById("ending-area");
  endArea.innerHTML = `
    <div class="ending-card">
      <div class="ending-sub">―― 18歳、春。到達エンディング ――</div>
      <div class="ending-title">${title}</div>
      <div class="ending-desc">${desc}</div>
      <div class="ending-stats">
        <strong>【18年間のハイライト】</strong><br>
        ${hlHtml}
      </div>
      <div class="ending-actions">
        <button class="share-btn" id="btn-copy" onclick="copyResult()">結果をコピーしてシェアする</button>
        <button class="primary" onclick="initGame()">もう一度、別の青春を生きる</button>
      </div>
    </div>
  `;
  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 100);
}

function s_friendName() {
  return state.friend.name;
}

function copyResult() {
  const hlText = state.highlights.length > 0
    ? state.highlights.map(h => `・${h}`).join("\n")
    : "・穏やかで平穏な18年間を過ごした";

  const shareText = `【18回目の春に — 青春シミュレーター】\n到達エンディング：${state.endingTitle}\n\n${hlText}\n\n#18回目の春に`;
  
  navigator.clipboard.writeText(shareText).then(() => {
    const btn = document.getElementById("btn-copy");
    btn.textContent = "コピーしました！（SNSやLINEに貼れます）";
    setTimeout(() => {
      btn.textContent = "結果をコピーしてシェアする";
    }, 3000);
  });
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    document.getElementById("btn-auto").textContent = "停止";
    autoTimer = setInterval(() => {
      if (!state.waitingChoice && !state.finished) nextYear();
    }, 1000);
  }
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    document.getElementById("btn-auto").textContent = "オート";
  }
}

window.onload = initGame;
</script>
